name: LUONG HAK V10.4 Windows Setup
on:
  workflow_dispatch:
  push:
    branches:
      - feature/luong-hak-v10-4-enterprise-ui
    paths:
      - 'LuongHAK_Offline/**'
      - '.github/workflows/luong-hak-v10-4-setup.yml'
permissions:
  contents: read
jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test payroll engine and integrations
        run: npm test
      - name: Build Windows NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: HAK-LUONG-V10.4-Windows-Setup-${{ github.run_number }}
          path: LuongHAK_Offline/dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
