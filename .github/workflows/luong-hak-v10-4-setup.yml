name: LUONG HAK V10.4 Windows Setup
# Luồng CI/phát hành duy nhất (v2.0.15 gộp build-exe.yml, build-windows.yml, luong-offline-quality-audit.yml vào đây).
# Mọi PR chạy đủ bộ kiểm tra. Push lên main chỉ khi đổi mã/cấu hình (đổi riêng tài liệu thì không phát hành).
# Thứ tự: check (cú pháp, lint, unit/integration/regression, ui-dom, phụ thuộc) -> E2E/visual/inherited-quality/consolidation -> build bộ cài -> phát hành (chỉ main).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'LuongHAK_Offline/**'
      - '.github/workflows/luong-hak-v10-4-setup.yml'
      - 'ci/quality-python/**'
      - 'HAK_AI_SKILLS/**'
      - 'HAK_ACCOUNTING_REPORT_STANDARD/**'
      - 'HAK_SMART_FILTER/**'
      - 'design-system/**'
      - 'experimental/**'
      - 'legacy/**'
      - 'scripts/check-consolidation.cjs'
      - 'docs/CONSOLIDATED_BRANCHES.json'
      - 'package.json'
env:
  # Một phiên bản Playwright duy nhất cho mọi job E2E (chỉ là bộ điều khiển Electron khi test, không đi vào bộ cài).
  PLAYWRIGHT_VERSION: '1.64.1'
  # Bộ E2E cũ tự ghi data.json giữa các lần mở app và đọc data.json ngay sau khi lưu. Ở chế độ SQLite (mặc định từ v2.0.29) hai cờ nghiệm thu này
  # xuất data.json đồng bộ và nhận data.json do bộ test ghi. Kịch bản sqlite-default.cjs đặt chúng về "0" để kiểm chế độ THẬT.
  HAK_SQLITE_EXPORT_SYNC: "1"
  HAK_SQLITE_ADOPT_EXTERNAL: "1"
permissions:
  contents: read
jobs:
  check:
    name: Cú pháp · Lint · Unit/Integration/Regression · Phụ thuộc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.release-preflight.outputs.publish }}
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Kiểm tra phiên bản trước khi phát hành
        id: release-preflight
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          result=0
          git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null || result=$?
          case "$result" in
            0) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::Tag $tag đã tồn tại. CI chỉ tạo artifact để kiểm thử." ;;
            2) test -f "../docs/releases/$tag.md"; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - run: npm ci --no-audit --no-fund
      - name: Kiểm tra cú pháp
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js engine.js hr.js main.js preload.js; do node --check "$f"; done
          find core main ui tests -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Lint (eslint, không chấp nhận cảnh báo)
        run: npm run lint
      - name: Unit + Integration + Regression
        run: npm test
      - name: Kiểm tra DOM giao diện (focus, ngăn kéo)
        run: npm run test:ui-dom
      - name: Kiểm tra phụ thuộc — phần chạy trong app (bắt buộc sạch)
        run: npm audit --omit=dev --audit-level=low
      - name: Kiểm tra phụ thuộc — công cụ build (chỉ báo cáo, xem docs/AUDIT_REPORT.md)
        run: npm audit --audit-level=high || echo "::warning::Có lỗ hổng trong công cụ build — xem báo cáo"
        continue-on-error: true
  windows-setup:
    name: Build bộ cài Windows
    needs: [check, electron-full-e2e, electron-e2e, workspace-visual, inherited-quality, consolidation]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test payroll engine and integrations
        run: npm test
      - name: Test drawer DOM focus regressions
        run: npm run test:ui-dom
      - name: Build Windows NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify handwriting runtime and weights in packaged app
        run: node scripts/verify-packaged-handwriting.cjs
      - name: Tự kiểm OCR trong bản đóng gói (asarUnpack, worker, dữ liệu ngôn ngữ)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $env:HAK_OCR_SELFTEST = "$PWD/ocr-selftest.json"
          $p = Start-Process -FilePath $exe.FullName -PassThru -Wait
          Get-Content ocr-selftest.json
          if ($p.ExitCode -ne 0) { throw "OCR selftest thất bại (exit $($p.ExitCode))" }
      - name: Tự kiểm SQLite trong bản đóng gói (node:sqlite, PRAGMA, lưu/đóng/mở/đọc)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $env:HAK_SQLITE_SELFTEST = "$PWD/sqlite-selftest.json"
          $p = Start-Process -FilePath $exe.FullName -PassThru -Wait
          Get-Content sqlite-selftest.json
          if ($p.ExitCode -ne 0) { throw "SQLite selftest thất bại (exit $($p.ExitCode))" }
          $r = Get-Content sqlite-selftest.json -Raw | ConvertFrom-Json
          if (-not $r.packaged) { throw "SQLite selftest không chạy trong bản đóng gói" }
      - name: Cài, chạy, nâng cấp đè và gỡ bằng BỘ CÀI THẬT (NSIS im lặng; dữ liệu giả)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          $setup = (Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1).FullName
          $prevArgs = @()
          $tag = (gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName' 2>$null)
          if ($tag) {
            New-Item -ItemType Directory -Force prev | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*Setup*.exe' --dir prev 2>$null
            $p = Get-ChildItem prev -Filter '*Setup*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p -and ($p.Name -notlike "*$((Get-Content package.json | ConvertFrom-Json).version).exe")) { $prevArgs = @('--prev', $p.FullName) }
          }
          Write-Host "Setup: $setup; bản trước: $($prevArgs -join ' ')"
          node tests/e2e/installed-setup.cjs --setup $setup @prevArgs
          if ($LASTEXITCODE -ne 0) { throw "Kiểm bộ cài thật thất bại (exit $LASTEXITCODE)" }
      - name: Upload installer EXE
        uses: actions/upload-artifact@v7
        continue-on-error: true # evidence upload only; tests/build remain mandatory
        with:
          name: HAK-LUONG-V10.4-Windows-Setup-${{ github.run_number }}
          path: LuongHAK_Offline/dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
  electron-full-e2e:
    name: E2E trên Electron thật
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies and Electron test driver
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Run full Electron suite with isolated synthetic data
        run: xvfb-run -a npm run test:e2e
      - name: Measure shared OCR per-cell accuracy
        run: xvfb-run -a npm run test:ocr-eval
        env:
          OCR_EVAL_REPORT: tests/e2e/shared-ocr-eval.json
      - name: Upload full Electron and OCR test evidence
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: HAK-LUONG-V10.4-Full-Electron
          path: |
            LuongHAK_Offline/tests/e2e/last-e2e-result.json
            LuongHAK_Offline/tests/e2e/shared-ocr-eval.json
          retention-days: 14

  electron-e2e:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies and Electron test driver
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Verify yearly archive lifecycle on synthetic records
        run: node tests/e2e/year-archive.cjs
        env:
          E2E_SHOTS: tests/e2e/screenshots
      - name: Verify review-only document workflow on synthetic evidence
        run: node tests/e2e/document-review.cjs
      - name: Verify first-run restore without a matching local journal
        run: node tests/e2e/restore-first-run.cjs
      - name: Verify legacy payroll migration and first admin setup
        run: node tests/e2e/legacy-upgrade.cjs
      - name: Verify production carry and period input replacement
        run: node tests/e2e/production-carry.cjs
        env:
          E2E_SHOTS: tests/e2e/screenshots
      - name: Verify editor stability and production transfer
        run: |
          $suites = @('contract-edit-stability', 'contract-scroll-stability', 'hr-editor-stability', 'catalog-filter-stability', 'production-reperiod')
          foreach ($suite in $suites) {
            node "tests/e2e/$suite.cjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify HR durable save and renderer crash exit
        run: node tests/e2e/hr-save-close.cjs
      - name: Verify input safety, pinned headers and safe window closing
        run: node tests/e2e/input-safety.cjs
        env:
          E2E_SHOTS: tests/e2e/screenshots
      - name: Verify explicit draft approval and disk failure rollback
        run: node tests/e2e/input-review.cjs
      - name: Verify explicit direct and team pump allocation
        run: node tests/e2e/bandam-direct.cjs
        env:
          E2E_SHOTS: tests/e2e/screenshots
      - name: Verify dispensing end to end (roles mode, transfer, recall, reports, backup restore)
        run: node tests/e2e/capphat.cjs
        env:
          E2E_SHOTS: tests/e2e/screenshots
      - name: Verify SQLite storage in real mode (upgrade from data.json, kill after save, outside edit conflict, rollback)
        run: node tests/e2e/sqlite-default.cjs
      - name: Verify stale-base protection on save (outside writes are not overwritten; UI asks; reload and close paths)
        run: node tests/e2e/stale-base.cjs
      - name: Verify input filters follow the department on each row date (role without payroll view)
        run: node tests/e2e/input-filter-dept.cjs
        env:
          E2E_SHOTS: tests/e2e/screenshots
      - name: Upload Electron test evidence
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true # evidence upload only; tests/build remain mandatory
        with:
          name: HAK-LUONG-V10.4-Electron-E2E-${{ github.run_number }}
          path: |
            LuongHAK_Offline/tests/e2e/year-archive-result.json
            LuongHAK_Offline/tests/e2e/document-review-result.json
            LuongHAK_Offline/tests/e2e/screenshots/*.png
          retention-days: 14
  workspace-visual:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 4576259a2f7d079b91a915abeeec54cdd4e82d64
          path: .comparison/v103
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install visual test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@${{ env.PLAYWRIGHT_VERSION }} --no-audit --no-fund
      - name: Capture V10.3 reference with identical synthetic data
        run: npm run test:workspace
        env:
          APP_UNDER_TEST: ${{ github.workspace }}/.comparison/v103/LuongHAK_Offline
          VISUAL_BASELINE: '1'
          VISUAL_OUT: ${{ github.workspace }}/visual-evidence/before-v103
      - name: Verify V10.4 layouts and all themes
        if: success() || failure()
        run: npm run test:workspace
        env:
          VISUAL_OUT: ${{ github.workspace }}/visual-evidence/after-v104
      - uses: actions/upload-artifact@v7
        continue-on-error: true # evidence upload only; tests/build remain mandatory
        if: always()
        with:
          name: HAK-V10.3-V10.4-Visual-${{ github.run_number }}
          path: visual-evidence/
          retention-days: 30
  inherited-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          repository: saoluucvhak-pixel/HAK_OCR_ENGINE
          ref: 4ee3181603a3886fcb7583f02f2152b245d79dd9
          path: .comparison/shared-ocr
      - name: Verify pinned common OCR source parity
        run: node LuongHAK_Offline/scripts/verify-shared-ocr.cjs .comparison/shared-ocr
      # Bộ lọc và design system dùng chung: commit ghim phải trùng shared-modules.lock.json (script báo lỗi nếu bản gốc khác mã băm đã ghi).
      - uses: actions/checkout@v7
        with:
          repository: saoluucvhak-pixel/HAK_SMART_FILTER
          ref: 555d29ca27464510f750052019f94e27c398f227
          path: .comparison/shared-modules/smart-filter
      - uses: actions/checkout@v7
        with:
          repository: saoluucvhak-pixel/HAK-Enterprise-Design-System
          ref: 0eab12ef5da55fd6d04a0bfd8c804164781f5fea
          path: .comparison/shared-modules/design-system
      - name: Verify shared filter and design-system files against lock and upstream
        run: node scripts/verify-shared-modules.cjs .comparison/shared-modules
      # alpha.41: main/write-policy.js là ngoại lệ ĐÃ ĐƯỢC CHỦ SỞ HỮU DUYỆT (bỏ chốt "nhật ký chỉ được thêm") — xem docs/releases/v2.0.0-alpha.41.md
      # alpha.45: owner-approved period replacement/production deferral; default engine equality remains enforced by check-consolidation.cjs; 25 carry/batch tests plus real Electron cover the new boundaries.
      - name: Verify unmodified sources outside approved production carry boundaries
        # v2.0.8: payroll-reports.js được sửa có chủ đích (dung sai làm tròn 500đ ở báo cáo Chi tiết nhân viên), có test U-PAY94-ROUND; chủ sở hữu đã đồng ý.
        # v2.0.9: report-html.js được sửa để phân trang PDF trọn kỳ, có kiểm thử Electron.
        # 17/11/2026 — chủ sở hữu duyệt sửa hai lỗi nêu trong rà soát mã nguồn, KHÔNG đổi công thức lương:
        #   core/reconcile.js: công cụ đối chiếu Excel (chỉ đọc) đọc ô dạng chữ ("500.000", "1.234,5", "0,175") theo cùng quy tắc engine.js; test so khớp với engine.
        #   core/payroll-steps.js: thanh 7 bước nói rõ cần duyệt trước khi chốt ở chế độ phân quyền; chỉ đổi lời giải thích, không đổi trạng thái từng bước.
        # core/smart-filter.js: đồng bộ với HAK_SMART_FILTER e99bb7e (không ghi đè kho bộ lọc đã lưu bị lỗi), chủ sở hữu đồng ý 15/11/2026; nội dung bị khóa bởi shared-modules.lock.json.
        # v2.0.21: quyền lập/duyệt, quy trình phê duyệt và danh sách quyền IPC được kiểm tra bởi các test phân quyền.
        # Hai mô-đun nghiệp vụ mới có kiểm thử riêng cho xác nhận ca dài và định mức phúc lợi.
        run: git diff --exit-code c389ef4ffcfd13a4f867cb070db2069314617dc7 -- LuongHAK_Offline/engine.js LuongHAK_Offline/hr.js LuongHAK_Offline/core LuongHAK_Offline/main LuongHAK_Offline/main.js LuongHAK_Offline/preload.js ":(exclude)LuongHAK_Offline/engine.js" ":(exclude)LuongHAK_Offline/hr.js" ":(exclude)LuongHAK_Offline/core/integrity.js" ":(exclude)LuongHAK_Offline/core/ocr-learning/rules.js" ":(exclude)LuongHAK_Offline/core/timesheet-parse.js" ":(exclude)LuongHAK_Offline/core/timesheet-ocr.js" ":(exclude)LuongHAK_Offline/core/page-rectify.js" ":(exclude)LuongHAK_Offline/main/write-policy.js" ":(exclude)LuongHAK_Offline/core/identity.js" ":(exclude)LuongHAK_Offline/main/umi-ocr.js" ":(exclude)LuongHAK_Offline/main/ocr-service.js" ":(exclude)LuongHAK_Offline/main/ocr-control.js" ":(exclude)LuongHAK_Offline/main/handwritten-digits.js" ":(exclude)LuongHAK_Offline/core/schema.js" ":(exclude)LuongHAK_Offline/main.js" ":(exclude)LuongHAK_Offline/preload.js" ":(exclude)LuongHAK_Offline/main/fullbackup.js" ":(exclude)LuongHAK_Offline/main/fullbackup-worker.js" ":(exclude)LuongHAK_Offline/main/restore.js" ":(exclude)LuongHAK_Offline/main/pdf.js" ":(exclude)LuongHAK_Offline/main/year-archive.js" ":(exclude)LuongHAK_Offline/main/year-archive-worker.js" ":(exclude)LuongHAK_Offline/main/year-archive-export.js" ":(exclude)LuongHAK_Offline/core/input-batch.js" ":(exclude)LuongHAK_Offline/core/bandam-entry.js" ":(exclude)LuongHAK_Offline/core/input-review.js" ":(exclude)LuongHAK_Offline/core/input-safety.js" ":(exclude)LuongHAK_Offline/core/repository.js" ":(exclude)LuongHAK_Offline/core/payroll-gate.js" ":(exclude)LuongHAK_Offline/core/production-carry.js" ":(exclude)LuongHAK_Offline/core/production-alloc.js" ":(exclude)LuongHAK_Offline/core/validate.js" ":(exclude)LuongHAK_Offline/core/payroll-close.js" ":(exclude)LuongHAK_Offline/main/payroll-gate.js" ":(exclude)LuongHAK_Offline/main/window-close.js" ":(exclude)LuongHAK_Offline/core/bh-report.js" ":(exclude)LuongHAK_Offline/core/pre-close-checklist.js" ":(exclude)LuongHAK_Offline/core/importer.js" ":(exclude)LuongHAK_Offline/core/reporting/payroll-reports.js" ":(exclude)LuongHAK_Offline/core/payment-ledger.js" ":(exclude)LuongHAK_Offline/core/reporting/ops-reports.js" ":(exclude)LuongHAK_Offline/core/reporting/report-html.js" ":(exclude)LuongHAK_Offline/core/reporting/period-reports.js" ":(exclude)LuongHAK_Offline/core/leave-reconciliation.js" ":(exclude)LuongHAK_Offline/core/smart-filter.js" ":(exclude)LuongHAK_Offline/core/reconcile.js" ":(exclude)LuongHAK_Offline/core/payroll-steps.js" ":(exclude)LuongHAK_Offline/core/permissions.js" ":(exclude)LuongHAK_Offline/core/workflow-approval.js" ":(exclude)LuongHAK_Offline/main/ipc-guard.js" ":(exclude)LuongHAK_Offline/core/production-attendance.js" ":(exclude)LuongHAK_Offline/core/benefits.js" ":(exclude)LuongHAK_Offline/core/benefits-rules.js" ":(exclude)LuongHAK_Offline/core/benefits-ledger.js" ":(exclude)LuongHAK_Offline/core/benefits-import.js" ":(exclude)LuongHAK_Offline/main/sqlite-store.js" ":(exclude)LuongHAK_Offline/main/sqlite-migrate.js" ":(exclude)LuongHAK_Offline/main/sqlite-changeset.js" ":(exclude)LuongHAK_Offline/main/sqlite-mirror.js" ":(exclude)LuongHAK_Offline/main/sqlite-storage.js" ":(exclude)LuongHAK_Offline/main/sqlite-selftest.js" ":(exclude)LuongHAK_Offline/main/year-job.js" ":(exclude)LuongHAK_Offline/core/reporting/total-row.js" ":(exclude)LuongHAK_Offline/core/reporting/report-filter.js" ":(exclude)LuongHAK_Offline/core/reporting/internal-payroll.js"
      - uses: actions/cache/restore@v6
        with:
          path: hak-project-memory.jsonl
          key: hak-observer-v104-${{ github.sha }}
          restore-keys: hak-observer-v104-
      - name: Execute inherited quality gate and library tests
        run: python ci/quality-python/quality_gate.py --config ci/quality-python/config/luong-hak.json --root . --out hak-quality-results.json
      # Quét mã đi vào bộ cài (bỏ thư mục tests). Bắt buộc: có phát hiện mức high (eval, new Function, child_process.exec...) thì job đỏ.
      - name: Static security scan of shipped code (high findings fail the job)
        run: python ci/quality-python/security_audit.py --root LuongHAK_Offline --exclude tests --out hak-security-results.json
      - name: Analyze dependencies with inherited analyzer
        run: python ci/quality-python/architecture_analyzer.py --root LuongHAK_Offline --changed app.js --changed ui/formula-master.js --out hak-architecture-results.json
      - name: Update sanitized Observer memory
        run: python ci/quality-python/ci_observer.py --quality hak-quality-results.json --security hak-security-results.json --architecture hak-architecture-results.json --project LUONG_HAK --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --memory hak-project-memory.jsonl --out hak-skill-proposals.json
      - uses: actions/cache/save@v6
        with:
          path: hak-project-memory.jsonl
          key: hak-observer-v104-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        continue-on-error: true # evidence upload only; tests/build remain mandatory
        if: always()
        with:
          name: HAK-Inherited-Quality-${{ github.run_number }}
          path: |
            hak-quality-results.json
            hak-security-results.json
            hak-architecture-results.json
            hak-project-memory.jsonl
            hak-skill-proposals.json
          retention-days: 30

  consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run test:legacy
      - run: npm run test:kpi

  publish-release:
    if: github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    needs: [check, windows-setup, electron-full-e2e, electron-e2e, workspace-visual, inherited-quality, consolidation]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build verified release without Actions artifact dependency
        shell: pwsh
        run: |
          Push-Location LuongHAK_Offline
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          node scripts/verify-packaged-handwriting.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged OCR verification failed' }
          Pop-Location
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item LuongHAK_Offline/dist/*Setup*.exe release/
      - name: Publish immutable versioned Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appVersion = (Get-Content -LiteralPath LuongHAK_Offline/package.json -Raw | ConvertFrom-Json).version
          $releaseTag = "v$appVersion"
          $notesPath = "docs/releases/$releaseTag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw 'Missing release notes for app version' }
          git rev-parse --verify "refs/tags/$releaseTag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $releaseTag already exists. Increase app version, do not overwrite it." }
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $releaseTag already exists. Do not overwrite it." }
          $setupFiles = @(Get-ChildItem -LiteralPath release -Filter '*Setup*.exe' -File)
          if ($setupFiles.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          if ($setupFiles[0].Name -notlike "*$appVersion.exe") { throw 'Installer version mismatch' }
          $setupHash = (Get-FileHash -LiteralPath $setupFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  $($setupFiles[0].Name)" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          @{version=$appVersion; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; installer=$setupFiles[0].Name; sha256=$setupHash} | ConvertTo-Json | Set-Content -LiteralPath release/BUILD_INFO.json -Encoding utf8
          Copy-Item -LiteralPath $notesPath -Destination release/RELEASE_NOTES.md
          Add-Content -LiteralPath release/RELEASE_NOTES.md -Value "`nCommit: $env:GITHUB_SHA`nBuild: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $releaseArgs = @('release', 'create', $releaseTag, $setupFiles[0].FullName, 'release/SHA256SUMS.txt', 'release/BUILD_INFO.json',
            '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "HAK Luong V10.4 - $appVersion", '--notes-file', 'release/RELEASE_NOTES.md')
          if ($appVersion -match '-' -or (Select-String -LiteralPath $notesPath -Pattern '^Trạng thái: thử nghiệm có kiểm soát' -Quiet)) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Windows release' }
