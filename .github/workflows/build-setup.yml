name: Build Windows setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'installer/setup.nsi', 'installer/native/**', '.github/workflows/build-setup.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build HAKDocs.exe from source (Windows OCR + Save helper)
        shell: pwsh
        run: |
          & ./installer/native/build.ps1
          if (-not (Test-Path app/native/HAKDocs.exe)) { throw 'HAKDocs.exe was not built' }
          Get-Item app/native/HAKDocs.exe | Format-List Name, Length, LastWriteTime
      - name: Smoke-test HAKDocs.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath app/native/HAKDocs.exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try { $r = Invoke-WebRequest -Uri http://127.0.0.1:31879/status -UseBasicParsing; $ok = ($r.StatusCode -eq 200) } catch { }
            }
            if (-not $ok) { throw 'HAKDocs --serve did not answer /status' }
            Write-Host "status: $($r.Content)"
            $h = @{ 'X-HAK-Client' = 'documents-v1'; 'Content-Type' = 'application/json' }
            # file operations answer normally (list saved downloads)
            $l = Invoke-WebRequest -Uri http://127.0.0.1:31879/download-files -Method Post -Headers $h -Body '{"action":"list"}' -UseBasicParsing
            if ($l.StatusCode -ne 200) { throw "download-files list returned $($l.StatusCode)" }
            # an oversized request must get a real 413 answer (not a connection reset => browser 'Failed to fetch')
            $big = New-Object byte[] (40MB)
            $b = Invoke-WebRequest -Uri http://127.0.0.1:31879/save-download -Method Post -Headers $h -Body $big -UseBasicParsing -SkipHttpErrorCheck
            if ($b.StatusCode -ne 413) { throw "oversized request returned $($b.StatusCode), expected 413" }
            Write-Host 'HAKDocs smoke test passed'
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Build setup.exe
        shell: pwsh
        run: |
          Copy-Item app installer/app -Recurse
          Copy-Item installer/icon/app.ico installer/app/app.ico
          Remove-Item installer/app/MoKhoa_1Lan*.html, installer/app/XoaSach_DuLieu*.html -ErrorAction SilentlyContinue
          $ver = (Select-String -Path installer/setup.nsi -Pattern '!define VERSION "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          $mk = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", "C:\ProgramData\chocolatey\lib\nsis\tools\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mk) { $cmd = Get-Command makensis -ErrorAction SilentlyContinue; if ($cmd) { $mk = $cmd.Source } }
          if (-not $mk) { Get-ChildItem 'C:\Program Files*' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Write-Host "found: $($_.FullName)" }; throw 'makensis.exe not found' }
          Write-Host "makensis: $mk"
          & $mk /DVERSION=$ver installer/setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          Move-Item installer/HAK_TinhLuong_Setup.exe "HAK_TinhLuong_Setup_v$ver.exe"
          Get-FileHash "HAK_TinhLuong_Setup_v$ver.exe" -Algorithm SHA256 | Format-List
          "SETUP=HAK_TinhLuong_Setup_v$ver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: HAK_TinhLuong_Setup
          path: HAK_TinhLuong_Setup_v*.exe
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: HAK Tính lương v${{ env.VERSION }}
          body: |
            Bộ cài Windows **v${{ env.VERSION }}** — dựng tự động từ commit ${{ github.sha }}.
            Tải file `HAK_TinhLuong_Setup_v${{ env.VERSION }}.exe`, chạy để cài / cập nhật (giữ nguyên đường dẫn cài mặc định để không mất dữ liệu).
            Bộ cài chưa ký số: Windows có thể hiện cảnh báo SmartScreen. Chi tiết thay đổi: NHAT_KY_PHIEN_BAN.md.
          files: HAK_TinhLuong_Setup_v*.exe
          fail_on_unmatched_files: true
