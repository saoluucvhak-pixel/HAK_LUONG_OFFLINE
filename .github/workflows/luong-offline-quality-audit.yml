name: LUONG HAK Offline Quality Audit
on:
  workflow_dispatch:
  push:
    branches:
      - audit/luong-hak-offline-v10-3-quality
  pull_request:
    paths:
      - 'LuongHAK_Offline/**'
      - '.github/workflows/luong-offline-quality-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: LuongHAK_Offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find core main tests -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check main.js
          node --check preload.js
      - name: Install application dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run offline unit integration and regression tests
        run: npm test
      - name: Store audit metadata
        if: always()
        shell: bash
        run: |
          printf '{"repository":"LUONG_HAK","target":"LuongHAK_Offline","branch":"%s","commit":"%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > audit-meta.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true # quota failure must not mask test result
        with:
          name: luong-hak-offline-audit-${{ github.run_id }}
          path: LuongHAK_Offline/audit-meta.json
          if-no-files-found: warn
          retention-days: 14
